<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelo Martinez Portfolio</title>
    <style>
        /* Base page styling to center the portfolio */
        body {
            background-color: #0d1117; /* Matches the background of the image */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Keeps the portfolio locked to the screen */
        }

        /* Container for the portfolio image and the clickable links */
        .portfolio-container {
            position: relative;
            /* Use image aspect ratio for responsive scaling (width:height) */
            aspect-ratio: 16 / 9; 
            width: 90vw; /* 90% of viewport width */
            max-width: 1280px; /* Optional maximum width */
            background-image: url('portfolio_render.png'); /* <<< NAME YOUR IMAGE HERE */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); /* Optional drop shadow */
            border-radius: 20px; /* Matching the container border */
        }

        /* Base styling for all links */
        .project-link {
            position: absolute;
            display: block;
            text-decoration: none;
            color: transparent; /* Makes text invisible but detectable by screen readers */
            background-color: transparent;
            cursor: pointer;
            border-radius: 8px; /* Optional for subtle click interaction */
        }

        /* Invisible Links Placement (Percentages used for responsiveness)
           Top left coordinates (top/left) and dimensions (width/height)
           Coordinates were measured to cover 'View Project Details'
        */

        /* Row 1 */
        .link-internal {
            top: 36%;  left: 41.5%;
            width: 14%; height: 9.5%;
        }

        .link-web {
            top: 36%;  left: 77%;
            width: 14%; height: 9.5%;
        }

        /* Row 2 */
        .link-wifi {
            top: 55%;  left: 41.5%;
            width: 14%; height: 9.5%;
        }

        .link-social {
            top: 55%;  left: 77%;
            width: 14%; height: 9.5%;
        }

        /* Row 3 */
        .link-ad {
            top: 74%;  left: 41.5%;
            width: 14%; height: 9.5%;
        }

        .link-cloud {
            top: 74%;  left: 77%;
            width: 14%; height: 9.5%;
        }

        /* Simple Hover Interaction (Optional) */
        .project-link:hover {
            background-color: rgba(255, 255, 255, 0.05); /* Very subtle glow effect */
        }

    </style>
</head>
<body>

    <div class="portfolio-container">
        <a href="#internal-network" class="project-link link-internal">Internal Network Details</a>
        <a href="#web-app" class="project-link link-web">Web App Details</a>
        
        <a href="#wifi-audit" class="project-link link-wifi">Wi-Fi Audit Details</a>
        <a href="#social-eng" class="project-link link-social">Social Engineering Details</a>
        
        <a href="#ad-vuln" class="project-link link-ad">Active Directory Details</a>
        <a href="#cloud-infra" class="project-link link-cloud">Cloud Infrastructure Details</a>
    </div>

</body>
</html>
