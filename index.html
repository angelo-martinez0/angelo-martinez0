<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelo Gabriel A. Martinez | Penetration Testing Portfolio</title>
    <style>
        /* Base Reset & Cyberpunk Theme Colors */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117; /* GitHub Dark Mode Background */
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Portfolio Container */
        .portfolio-container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            padding: 40px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 2px solid #21262d;
            padding-bottom: 20px;
        }

        h1 {
            color: #58a6ff; /* Neon Cyber Blue */
            font-size: 2rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Project Section & List */
        .projects-section {
            margin-top: 20px;
        }

        h2 {
            color: #ff7b72; /* Accent color for section titles */
            font-size: 1.25rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .project-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Project Links / Cards */
        .project-item a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #21262d;
            border: 1px solid #30363d;
            padding: 18px 24px;
            border-radius: 8px;
            color: #f0f6fc;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.25s ease-in-out;
        }

        /* Hover Effects */
        .project-item a:hover {
            background-color: #282e38;
            border-color: #58a6ff;
            transform: translateX(5px);
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.2);
        }

        /* Folder Icon Placeholder */
        .project-item a::before {
            content: "📁";
            margin-right: 12px;
            font-size: 1.2rem;
        }

        /* Arrow Indicator on the right */
        .project-item a::after {
            content: "→";
            color: #58a6ff;
            font-size: 1.2rem;
            transition: transform 0.2s ease;
        }

        .project-item a:hover::after {
            transform: translateX(3px);
        }

        /* Footer styling */
        footer {
            text-align: center;
            margin-top: 35px;
            color: #484f58;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        <header>
            <h1>Angelo Gabriel A. Martinez</h1>
            <div class="subtitle">Penetration Testing Portfolio</div>
        </header>

        <main class="projects-section">
            <h2>Active Cyber Security Projects</h2>
            <ul class="project-list">
                <li class="project-item">
                    <a href="./project-1/">Project 1</a>
                </li>
                <li class="project-item">
                    <a href="./project-2/">Project 2</a>
                </li>
                <li class="project-item">
                    <a href="./project-3/">Project 3</a>
                </li>
            </ul>
        </main>

        <footer>
            In Progress &bull; Learn Ethical Hacking From Scratch
        </footer>
    </div>

</body>
</html>
